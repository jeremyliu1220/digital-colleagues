# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project tools
        run: python -m pip install --disable-pip-version-check -r requirements/p4.lock
      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Type-check
        run: mypy src scripts tests
      - name: Test
        # P4 runner retains every scripts/run_p3_unittest_suite.py identity.
        run: >-
          python -B scripts/run_p4_unittest_suite.py
          --start-directory tests
          --top-level-directory .

  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: studio
      - name: Lint and format-check
        run: |
          npm run lint
          npm run format:check
        working-directory: studio
      - name: Type-check and test
        run: |
          npm run typecheck
          npm test
        working-directory: studio
      - name: Build
        run: npm run build
        working-directory: studio

  public-boundary:
    name: P4 boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify P3 repository and provenance
        run: |
          python -B scripts/check_p3_repository.py .
          python -B scripts/check_p3_provenance.py .
      - name: Verify P3 architecture, persistence, and contracts
        env:
          PYTHONPATH: src
        run: |
          python -B scripts/check_p3_architecture.py .
          python -B scripts/check_p3_migrations.py .
          python -B scripts/check_p3_persistence.py
          python -B scripts/check_p3_runtime_contracts.py .
          python -B scripts/check_p3_golden_path.py
          python -B scripts/check_p2_core_contracts.py .
      - name: Verify P4 repository, provenance, and architecture
        run: |
          python -B scripts/check_p4_repository.py .
          python -B scripts/check_p4_provenance.py .
          python -B scripts/check_p4_architecture.py .
      - name: Verify P4 migration, authentication, Studio, Compose, and Golden Path
        env:
          PYTHONPATH: src
        run: |
          python -B scripts/check_p4_migrations.py .
          python -B scripts/check_p4_authentication.py .
          python -B scripts/check_p4_studio.py .
          python -B scripts/check_p4_compose.py .
          python -B scripts/check_p4_golden_path.py
      - name: Scan public tree
        run: python -B scripts/check_public_boundary.py .
