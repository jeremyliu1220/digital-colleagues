# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  current-ci:
    name: Current P12 governance non-publishing verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Enable the package-manager integrity boundary
        run: corepack enable
      - name: Run current P12 governance non-publishing verification
        env:
          PYTHONPATH: src
        run: make ci

  main-compose-smoke:
    name: Bounded main Compose smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: current-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main push
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Run bounded main Compose smoke
        env:
          PYTHONPATH: src
        run: make p11r-compose-smoke
