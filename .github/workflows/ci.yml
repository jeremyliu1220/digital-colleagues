# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p8-public-gate:
    name: P8 public non-publishing Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Enable the package-manager integrity boundary
        run: corepack enable
      - name: Run complete P8 aggregate
        env:
          PYTHONPATH: src
        # The aggregate retains these established identities through the P8 unittest
        # runner and accepted-object checks: ruff check src scripts tests;
        # mypy src scripts tests; npm run typecheck; npm run build;
        # scripts/check_public_boundary.py; scripts/check_p3_architecture.py;
        # scripts/check_p3_migrations.py; scripts/check_p3_persistence.py;
        # scripts/check_p3_runtime_contracts.py; scripts/check_p3_golden_path.py;
        # scripts/check_p2_core_contracts.py; scripts/run_p3_unittest_suite.py.
        run: make check
