name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  current-ci:
    name: Current P12 governance non-publishing verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Enable the package-manager integrity boundary
        run: corepack enable
      - name: Run current P12 governance and emit one result envelope
        shell: bash
        run: |
          set +e
          umask 077
          gate_dir="${RUNNER_TEMP}/p12-current-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${gate_dir}"
          export P12_JSON_OUTPUT="${gate_dir}/gate.json"
          install -m 0600 /dev/null "${P12_JSON_OUTPUT}"
          make p12-current-ci
          gate_status=$?
          envelope_line="$(python3 -B scripts/run_p12_toolchain.py --scope emit-ci-envelope --job-kind current_governance --gate-result "${P12_JSON_OUTPUT}" --gate-exit-status "${gate_status}")"
          envelope_status=$?
          cleanup_status=0
          find "${gate_dir}" -type f -delete || cleanup_status=$?
          rmdir "${gate_dir}" || cleanup_status=$?
          if [ "${envelope_status}" -ne 0 ]; then exit "${envelope_status}"; fi
          if [ "${cleanup_status}" -ne 0 ]; then exit "${cleanup_status}"; fi
          printf '%s\n' "${envelope_line}"
          if [ "${gate_status}" -ne 0 ]; then exit "${gate_status}"; fi
          exit 0

  portable-history:
    name: Portable historical replay
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install Cosign verification tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Enable the package-manager integrity boundary
        run: corepack enable
      - name: Run portable history and emit one result envelope
        shell: bash
        run: |
          set +e
          umask 077
          gate_dir="${RUNNER_TEMP}/p12-history-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "${gate_dir}"
          export P12_JSON_OUTPUT="${gate_dir}/gate.json"
          install -m 0600 /dev/null "${P12_JSON_OUTPUT}"
          timeout --foreground --signal=TERM --kill-after=30s 9900s make p12-portable-history
          gate_status=$?
          envelope_line="$(python3 -B scripts/run_p12_toolchain.py --scope emit-ci-envelope --job-kind portable_history --gate-result "${P12_JSON_OUTPUT}" --gate-exit-status "${gate_status}")"
          envelope_status=$?
          cleanup_status=0
          find "${gate_dir}" -type f -delete || cleanup_status=$?
          rmdir "${gate_dir}" || cleanup_status=$?
          if [ "${envelope_status}" -ne 0 ]; then exit "${envelope_status}"; fi
          if [ "${cleanup_status}" -ne 0 ]; then exit "${cleanup_status}"; fi
          printf '%s\n' "${envelope_line}"
          if [ "${gate_status}" -ne 0 ]; then exit "${gate_status}"; fi
          exit 0

  main-compose-smoke:
    name: Bounded current P11R Compose smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - current-ci
      - portable-history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact main push
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Run bounded current P11R Compose smoke
        env:
          PYTHONPATH: src
        run: make p11r-compose-smoke
