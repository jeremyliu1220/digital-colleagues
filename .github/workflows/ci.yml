# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      operation:
        description: One-time P10 remote gate operation
        required: true
        type: choice
        options:
          - publish
          - verify
      confirm:
        description: Exact operation confirmation
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character publication source revision
        required: true
        type: string
      runtime_digest:
        description: Exact runtime index digest; required only for verify
        required: false
        default: ""
        type: string
      studio_digest:
        description: Exact Studio index digest; required only for verify
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  p10-public-gate:
    name: P10 public non-publishing verification
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/p8.lock
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Enable the package-manager integrity boundary
        run: corepack enable
      - name: Run P10 static non-publishing verification
        env:
          PYTHONPATH: src
        run: make p10-ci

  p10-dispatch-guard:
    name: Validate exact P10 dispatch authority
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      OPERATION: ${{ inputs.operation }}
      CONFIRM: ${{ inputs.confirm }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RUNTIME_DIGEST: ${{ inputs.runtime_digest }}
      STUDIO_DIGEST: ${{ inputs.studio_digest }}
    steps:
      - name: Fail closed unless repository, ref, revision, and operation are exact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "jeremyliu1220/digital-colleagues"
          test "$GITHUB_REF" = "refs/heads/codex/p10-mac-quickstart"
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$OPERATION" in
            publish)
              test "$CONFIRM" = "PUBLISH-P10-CANDIDATE"
              test -z "$RUNTIME_DIGEST"
              test -z "$STUDIO_DIGEST"
              ;;
            verify)
              test "$CONFIRM" = "VERIFY-P10-CANDIDATE"
              [[ "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$STUDIO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$RUNTIME_DIGEST" != "$STUDIO_DIGEST"
              ;;
            *)
              exit 1
              ;;
          esac

  p10-publish:
    name: Publish, sign, and attest exact P10 image indexes
    needs: p10-dispatch-guard
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jeremyliu1220/digital-colleagues' &&
      github.ref == 'refs/heads/codex/p10-mac-quickstart' &&
      inputs.candidate_sha == github.sha &&
      inputs.operation == 'publish' &&
      inputs.confirm == 'PUBLISH-P10-CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RUNTIME_SUBJECT: ghcr.io/jeremyliu1220/digital-colleagues-runtime
      STUDIO_SUBJECT: ghcr.io/jeremyliu1220/digital-colleagues-studio
      DISPLAY_TAG: sha-${{ github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Log in to GHCR for the authorized publication job
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the checksum-verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Build and push runtime index
        id: runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.p10
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.RUNTIME_SUBJECT }}:${{ env.DISPLAY_TAG }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_IDENTITY=https://github.com/jeremyliu1220/digital-colleagues
            PRODUCT_VERSION=0.2.0-dev.0
          labels: |
            org.opencontainers.image.source=https://github.com/jeremyliu1220/digital-colleagues
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign exact runtime digest with GitHub Actions OIDC
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes \
            -a "source_revision=$GITHUB_SHA" \
            "$RUNTIME_SUBJECT@$RUNTIME_DIGEST"
      - name: Attest exact runtime digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.RUNTIME_SUBJECT }}
          subject-digest: ${{ steps.runtime.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: Build and push Studio index
        id: studio
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: studio
          file: studio/Dockerfile.p10
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.STUDIO_SUBJECT }}:${{ env.DISPLAY_TAG }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_IDENTITY=https://github.com/jeremyliu1220/digital-colleagues
            PRODUCT_VERSION=0.2.0-dev.0
          labels: |
            org.opencontainers.image.source=https://github.com/jeremyliu1220/digital-colleagues
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Sign exact Studio digest with GitHub Actions OIDC
        env:
          STUDIO_DIGEST: ${{ steps.studio.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STUDIO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes \
            -a "source_revision=$GITHUB_SHA" \
            "$STUDIO_SUBJECT@$STUDIO_DIGEST"
      - name: Attest exact Studio digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.STUDIO_SUBJECT }}
          subject-digest: ${{ steps.studio.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          show-summary: false

      - name: Record public publication evidence
        env:
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          STUDIO_DIGEST: ${{ steps.studio.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P10 publication"
            echo "- repository: https://github.com/$GITHUB_REPOSITORY"
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- publication source revision: $GITHUB_SHA"
            echo "- runtime: $RUNTIME_SUBJECT@$RUNTIME_DIGEST"
            echo "- Studio: $STUDIO_SUBJECT@$STUDIO_DIGEST"
            echo "- platforms: linux/amd64, linux/arm64"
            echo "- keyless signature: created"
            echo "- GitHub provenance attestation: created"
          } >> "$GITHUB_STEP_SUMMARY"

  p10-verify:
    name: Verify public exact-digest P10 distribution without registry credentials
    needs: p10-dispatch-guard
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'jeremyliu1220/digital-colleagues' &&
      github.ref == 'refs/heads/codex/p10-mac-quickstart' &&
      inputs.candidate_sha == github.sha &&
      inputs.operation == 'verify' &&
      inputs.confirm == 'VERIFY-P10-CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      P10_REMOTE_PUBLICATION_SHA: ${{ inputs.candidate_sha }}
      P10_REMOTE_RUNTIME_DIGEST: ${{ inputs.runtime_digest }}
      P10_REMOTE_STUDIO_DIGEST: ${{ inputs.studio_digest }}
      P10_REMOTE_DOCKER_CONFIG: ${{ runner.temp }}/p10-anonymous-docker
      P10_REMOTE_USE_INSTALLED_TOOLS: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Install the checksum-verified Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Create an empty task-owned Docker credential boundary
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$P10_REMOTE_DOCKER_CONFIG"
          printf '%s\n' '{"auths":{}}' > "$P10_REMOTE_DOCKER_CONFIG/config.json"
      - name: Verify indexes, blobs, pulls, signatures, and attestations
        env:
          DOCKER_CONFIG: ${{ env.P10_REMOTE_DOCKER_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/check_p10_distribution.py --remote-from-env \
            > "$RUNNER_TEMP/p10-remote-result.json"
      - name: Record public verification evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## P10 independent remote verification"
            echo "- repository: https://github.com/$GITHUB_REPOSITORY"
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- publication source revision: $P10_REMOTE_PUBLICATION_SHA"
            echo "- runtime: ghcr.io/jeremyliu1220/digital-colleagues-runtime@$P10_REMOTE_RUNTIME_DIGEST"
            echo "- Studio: ghcr.io/jeremyliu1220/digital-colleagues-studio@$P10_REMOTE_STUDIO_DIGEST"
            echo "- platforms: linux/amd64, linux/arm64"
            echo "- anonymous exact-digest pulls: passed"
            echo "- Cosign identity, issuer, and source_revision: passed"
            echo "- GitHub artifact attestations: passed"
          } >> "$GITHUB_STEP_SUMMARY"
