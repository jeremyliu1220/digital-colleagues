# SPDX-License-Identifier: Apache-2.0

name: Bug report
description: Report a reproducible defect using sanitized evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, private source content, local absolute paths, or live-provider evidence. Security reports follow SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, using safe and reproducible detail?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest synthetic sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
      description: Use a public revision or release label only.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed sensitive, personal, private-source, and live-provider material.
          required: true
