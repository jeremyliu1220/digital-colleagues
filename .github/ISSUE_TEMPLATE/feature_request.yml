# SPDX-License-Identifier: Apache-2.0

name: Feature proposal
description: Propose a scoped capability within the active milestone.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user outcome
      description: Which inspectable problem should this solve?
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Earliest roadmap milestone
      options: [P12, P13, P14, P15, P16, P17, P18, P19, P20, Outside P12-P20]
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Authority, privacy, and claim boundaries
      description: What must remain forbidden or explicitly unclaimed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Repeatable acceptance evidence
      description: Which current P12-P20 owner, exact command, platform-scoped evidence class, and artifact would establish completion without promoting any of the five Ubuntu-excluded P8/P10 gates or their Darwin-only anchors, changing blocked Linux Public Pilot readiness, bypassing P20-L0, or starting a later milestone?
    validations:
      required: true
