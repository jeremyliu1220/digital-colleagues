# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "digital-colleagues"
version = "0.1.0"
description = "Local-first reference stack for persistent, governed AI coworkers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Digital Colleagues contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_colleagues"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["studio"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src", "scripts", "tests"]
